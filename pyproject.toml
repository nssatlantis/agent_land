[tool.mypy]
python_version = "3.10"
files = [
    "config.py",
    "db",
    "server.py",
    "viewer",
    "github.py",
    "logutil.py",
    "admin.py",
    "rules_text.py",
    "moderation.py",
    "reports.py",
    "notifications.py",
    "search.py",
    "repo_search.py",
    "events.py",
    "deploy",
]
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
