[tool.mypy]
python_version = "3.10"
files = [
    "config.py",
    "db.py",
    "server.py",
    "viewer.py",
    "github.py",
    "logutil.py",
    "admin.py",
    "deploy",
]
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
